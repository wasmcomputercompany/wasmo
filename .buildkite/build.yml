steps:
  - label: ":gradle: Build"
    commands:
      - "cat .buildkite/gradle.properties >> gradle.properties"
      - "gradle --no-daemon jvmTest"
    plugins:
      - docker-compose#v5.11.0:
          run: ci-build
          config: .buildkite/docker-compose.yml
          environment:
            - "BUILDKITE_ANALYTICS_TOKEN"
            - "BUILDKITE_BUILD_ID"
            - "BUILDKITE_BUILD_NUMBER"
            - "BUILDKITE_JOB_ID"
            - "BUILDKITE_BRANCH"
            - "BUILDKITE_COMMIT"
            - "BUILDKITE_MESSAGE"
            - "BUILDKITE_BUILD_URL"
      - docker-login#v3.0.0:
          username: wasmo
          isolate-config: false
      - test-collector#v1.0.0:
          files: "*/test-results/*.xml"
          format: "junit"
    secrets:
      - DOCKER_LOGIN_PASSWORD
